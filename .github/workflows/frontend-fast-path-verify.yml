name: Verify Frontend Fast Path

on:
  push:
    branches:
      - deploy/frontend-only-fast-path
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sbb-frontend-fast-path-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Materialize current release
        run: python3 tools/apply_v612_release.py
      - name: Run full verification
        run: bash VERIFY.sh
      - name: Test deploy scope classifier
        run: python3 tests/test_deploy_scope_classifier.py
      - name: Assert fast-path workflow contracts
        run: |
          grep -F 'Classify deployment scope' .github/workflows/deploy-pages.yml
          grep -F "needs.classify.outputs.backend_required == 'true'" .github/workflows/deploy-pages.yml
          grep -F "needs.backend.result == 'skipped'" .github/workflows/deploy-pages.yml
          grep -F 'cancel-in-progress: false' .github/workflows/deploy-pages.yml
          echo 'PASS: frontend-only fast-path workflow contracts'
