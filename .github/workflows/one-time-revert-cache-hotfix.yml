name: One-time revert cache hotfix

on:
  push:
    branches:
      - revert/cache-identity-hotfix-20260913
    paths:
      - .github/workflows/one-time-revert-cache-hotfix.yml

permissions:
  contents: write

jobs:
  revert:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: revert/cache-identity-hotfix-20260913
          fetch-depth: 0
      - name: Restore release-managed cache tokens
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          pairs={
            '<script src="app.js?v=5.5.0-r91807f"></script>':'<script src="app.js?v=5.5.0"></script>',
            '<script src="ui/score-ribbon-playback-follow-v545.js?v=5.5.0-r91807f"></script>':'<script src="ui/score-ribbon-playback-follow-v545.js?v=5.5.0"></script>',
          }
          for old,new in pairs.items():
            if s.count(old)!=1: raise SystemExit(f'missing exact revert target: {old}')
            s=s.replace(old,new,1)
          p.write_text(s,encoding='utf-8')
          PY
      - name: Commit revert and remove workflow
        shell: bash
        run: |
          rm .github/workflows/one-time-revert-cache-hotfix.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html .github/workflows/one-time-revert-cache-hotfix.yml
          git commit -m "Revert manual frontend cache identity hotfix"
          git push origin HEAD:revert/cache-identity-hotfix-20260913
