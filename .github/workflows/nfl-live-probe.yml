name: NFL Live Media Probe

on:
  push:
    branches:
      - fix/nfl-audit-source-reopen
    paths:
      - '.nfl-live-probe-trigger'
      - '.github/workflows/nfl-live-probe.yml'

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Query live NFL completed-game rows
        env:
          SBB_API_BASE_URL: ${{ vars.SBB_API_BASE_URL }}
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --connect-timeout 5 --max-time 90 -H 'Cache-Control: no-cache' \
            "$SBB_API_BASE_URL/api/history/audit?league=NFL&dateFrom=2026-09-01&dateTo=2026-09-12&limit=100&offset=0" > /tmp/audit.json
          python3 - <<'PY'
          import json
          data=json.load(open('/tmp/audit.json'))
          print('TOTAL',data.get('total'))
          for row in data.get('rows') or []:
              print('=== ROW ===')
              print(json.dumps(row,indent=2,sort_keys=True,default=str)[:30000])
          PY
