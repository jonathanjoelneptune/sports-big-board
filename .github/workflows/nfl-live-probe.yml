name: NFL Live Media Probe

on:
  push:
    branches:
      - fix/nfl-audit-source-reopen
    paths:
      - '.nfl-live-probe-trigger'
      - '.github/workflows/nfl-live-probe.yml'

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Query live NFL media audit
        env:
          SBB_API_BASE_URL: ${{ vars.SBB_API_BASE_URL }}
        run: |
          set -euo pipefail
          test -n "$SBB_API_BASE_URL"
          curl --fail --silent --show-error --max-time 90 "$SBB_API_BASE_URL/api/history/worker-console?limit=320" > /tmp/console.json
          curl --fail --silent --show-error --max-time 90 "$SBB_API_BASE_URL/api/history/audit?league=NFL&limit=500&offset=0" > /tmp/audit.json
          curl --fail --silent --show-error --max-time 90 "$SBB_API_BASE_URL/api/history/media-sources" > /tmp/sources.json
          python3 - <<'PY'
          import json
          console=json.load(open('/tmp/console.json'))
          audit=json.load(open('/tmp/audit.json'))
          sources=json.load(open('/tmp/sources.json'))
          print('=== WORKER CONSOLE ===')
          keys=('version','workMode','background','greenGap','greenGapQueue','mediaObjectives','officialSourceCatchup','ruleGameCatchup','workers','activeDiscoveries')
          print(json.dumps({k:console.get(k) for k in keys if k in console},indent=2,sort_keys=True)[:60000])
          print('=== NFL AUDIT SUMMARY ===')
          print(json.dumps({k:audit.get(k) for k in ('ok','version','total','summary','background','greenGap') if k in audit},indent=2,sort_keys=True)[:30000])
          print('NFL_ROWS',len(audit.get('rows') or []))
          print('=== NFL SOURCE REGISTRY ===')
          nfl=[r for r in (sources.get('rows') or []) if str(r.get('league') or '').upper()=='NFL']
          print(json.dumps(nfl,indent=2,sort_keys=True)[:40000])
          PY
