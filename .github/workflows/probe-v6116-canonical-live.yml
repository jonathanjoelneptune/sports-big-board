name: Probe v6.1.16 Canonical Production
on:
  push:
    branches: [ops-v6116-canonical-live-probe]
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Probe production canonical health
        env:
          BASE: https://34-20-148-56.sslip.io
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, urllib.request, time
          base='https://34-20-148-56.sslip.io'
          for path in ['/api/status','/api/canonical/certification/health','/api/canonical/validation/health']:
              print('\n===', path, '===')
              try:
                  with urllib.request.urlopen(base+path, timeout=30) as r:
                      data=json.load(r)
                  if path.endswith('/status'):
                      print(json.dumps({'ok':data.get('ok'),'version':data.get('version')},sort_keys=True))
                  elif 'certification' in path:
                      keep={k:data.get(k) for k in ['version','productionAuthority','officialScheduleWatchdogsVersion','officialScheduleWatchdogsCheckedAt','hardening','worker'] if k in data}
                      keep['adapters']=data.get('adapters')
                      print(json.dumps(keep,sort_keys=True))
                  else:
                      keep={k:data.get(k) for k in ['version','releaseVersion','productionAuthority','summary','stateConsistencyViolations','adapters','worker'] if k in data}
                      print(json.dumps(keep,sort_keys=True))
              except Exception as e:
                  print('ERROR',type(e).__name__,str(e))
          PY
