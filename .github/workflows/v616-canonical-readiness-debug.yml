name: Debug v6.1.6 Canonical Readiness

on:
  push:
    branches:
      - fix/canonical-slate-readiness-v616
  workflow_dispatch:

permissions:
  contents: read

jobs:
  debug:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - name: Materialize current release
        run: python3 tools/apply_v612_release.py
      - name: Compile readiness module
        run: python3 -m py_compile sbb/canonical_slate_readiness_v616.py
      - name: Verify writable SQLite NORMAL sync
        run: |
          python3 - <<'PY'
          import tempfile
          from pathlib import Path
          from sbb import canonical_shadow_v600 as shadow
          from sbb import canonical_slate_readiness_v616 as r
          r._install_connection_tuning()
          with tempfile.TemporaryDirectory() as td:
              store=shadow.CanonicalShadowStore(Path(td)/'c.sqlite3')
              with store._connect() as conn:
                  assert int(conn.execute('PRAGMA synchronous').fetchone()[0])==1
          print('PASS storage tuning')
          PY
      - name: Verify NCAAF resolved-state precedence
        run: |
          python3 - <<'PY'
          import tempfile
          from pathlib import Path
          from sbb import canonical_shadow_v600 as shadow
          from sbb import canonical_slate_readiness_v616 as r
          r._install_connection_tuning(); r._install_ncaaf_state_precedence()
          e={'competitionId':'NCAAF','scheduledAt':'2026-09-12T17:00:00Z','status':'SCHEDULED','away':{'name':'Alpha'},'home':{'name':'Beta'}}
          with tempfile.TemporaryDirectory() as td:
              s=shadow.CanonicalShadowStore(Path(td)/'c.sqlite3')
              s.upsert_event('e','NCAAF','2026-09-12',e,'NCAA_SD_DATA','RESOLVED','EXCLUDED','NCAAF_OUTSIDE_TOP25')
              s.upsert_event('e','NCAAF','2026-09-12',e,'ESPN_DIRECT','RESOLVED','UNKNOWN','DIRECT_ESPN_TOP25_NOT_PROVEN')
              row=s.events_for_day('2026-09-12','NCAAF')[0]
              assert row['inclusion_state']=='EXCLUDED',row
          print('PASS NCAAF precedence')
          PY
      - name: Verify NCAAF UNKNOWN repair
        run: |
          python3 - <<'PY'
          import tempfile
          from pathlib import Path
          from sbb import canonical_shadow_v600 as shadow
          from sbb import canonical_slate_readiness_v616 as r
          r._install_connection_tuning(); r._install_ncaaf_state_precedence()
          with tempfile.TemporaryDirectory() as td:
              s=shadow.CanonicalShadowStore(Path(td)/'c.sqlite3')
              for eid,rank in [('ranked',12),('unranked',0)]:
                  home={'name':'Home'+eid}
                  if rank: home['rank']=rank
                  e={'competitionId':'NCAAF','scheduledAt':'2026-09-12T19:00:00Z','status':'SCHEDULED','away':{'name':'Away'+eid},'home':home}
                  s.upsert_event(eid,'NCAAF','2026-09-12',e,'ESPN_DIRECT','RESOLVED','UNKNOWN','DIRECT_ESPN_TOP25_NOT_PROVEN')
                  s.record_schedule(eid,'NCAA_SD_DATA','AUTHORITATIVE','2026-09-12',e)
                  s.record_schedule(eid,'ESPN_INDEPENDENT','INDEPENDENT','2026-09-12',e)
              repair=r._repair_ncaaf_policy_states(s)
              rows={x['canonical_event_id']:x for x in s.events_for_day('2026-09-12','NCAAF')}
              assert rows['ranked']['inclusion_state']=='INCLUDED',rows['ranked']
              assert rows['unranked']['inclusion_state']=='EXCLUDED',rows['unranked']
              assert repair['repaired']==2,repair
          print('PASS NCAAF repair')
          PY
      - name: Verify canonical Eastern date rebucketing
        run: |
          python3 - <<'PY'
          import tempfile
          from pathlib import Path
          from sbb import canonical_shadow_v600 as shadow
          from sbb import canonical_slate_readiness_v616 as r
          r._install_connection_tuning(); r._install_canonical_date_comparisons()
          e={'competitionId':'MLS','scheduledAt':'2026-09-14T01:00:00Z','status':'SCHEDULED','away':{'name':'Philadelphia Union'},'home':{'name':'San Diego FC'}}
          with tempfile.TemporaryDirectory() as td:
              s=shadow.CanonicalShadowStore(Path(td)/'c.sqlite3')
              s.upsert_event('m','MLS','2026-09-13',e,'MLS_STATS_API','RESOLVED','INCLUDED','ALL_LEAGUE_EVENTS')
              s.record_schedule('m','MLS_STATS_API','AUTHORITATIVE','2026-09-13',e)
              s.record_schedule('m','ESPN_DIRECT','DIRECT','2026-09-13',e)
              s.record_schedule('m','DAY_STATE','LEGACY','2026-09-14',e)
              d=s.record_comparison('2026-09-13','MLS',set())
              assert d['matched']==1 and not d['canonicalOnly'] and not d['legacyOnly'],d
              d=s.record_comparison('2026-09-14','MLS',{'m'})
              assert not d['legacyOnly'],d
          print('PASS Eastern date rebucketing')
          PY
      - name: Run storage plus precedence in one process
        run: |
          python3 - <<'PY'
          import runpy
          d=runpy.run_path('tests/test_v616_canonical_slate_readiness.py',run_name='v616_test')
          d['verify_storage'](); d['verify_ncaaf_precedence']()
          print('PASS storage + precedence')
          PY
      - name: Run precedence plus repair in one process
        run: |
          python3 - <<'PY'
          import runpy
          d=runpy.run_path('tests/test_v616_canonical_slate_readiness.py',run_name='v616_test')
          d['verify_ncaaf_precedence'](); d['verify_ncaaf_repair']()
          print('PASS precedence + repair')
          PY
      - name: Run repair plus date in one process
        run: |
          python3 - <<'PY'
          import runpy
          d=runpy.run_path('tests/test_v616_canonical_slate_readiness.py',run_name='v616_test')
          d['verify_ncaaf_repair'](); d['verify_date_rebucketing']()
          print('PASS repair + date')
          PY
      - name: Run test main explicitly
        run: |
          python3 - <<'PY'
          import runpy
          d=runpy.run_path('tests/test_v616_canonical_slate_readiness.py',run_name='v616_test')
          d['main']()
          PY
