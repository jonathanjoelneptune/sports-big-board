name: Inspect Media Audit Discovery

on:
  push:
    branches:
      - media-audit/discovery-copy-info-v6116

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - name: Locate live repair source implementation
        run: |
          grep -Rni -C 45 -E 'NO_DIRECTORY_MATCH|OFFICIAL_TEAM_SOURCES|TEAM_SOURCE_REGISTRY|Persistent unresolved-team|repairJobsRequeued|team resolution queue|official sites|YT channels' --include='*.py' . || true
      - name: Locate release materialization for media audit
        run: |
          grep -Rni -C 45 -E 'media_audit_service|OFFICIAL_TEAM_SOURCES|NO_DIRECTORY_MATCH|TEAM_SOURCE_REGISTRY|repair source|team.source' scripts .github --include='*.py' --include='*.yml' || true
      - name: List repair/team source files
        run: |
          find . -maxdepth 3 -type f \( -iname '*repair*' -o -iname '*team*source*' -o -iname '*media*audit*' \) -print | sort
