name: One-time frontend cache identity hotfix

on:
  push:
    branches:
      - hotfix/frontend-cache-identity-20260913
    paths:
      - .github/workflows/one-time-cache-identity-hotfix.yml

permissions:
  contents: write

jobs:
  patch-test-cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: hotfix/frontend-cache-identity-20260913
          fetch-depth: 0

      - name: Bust cache for reverted playback and playback-follow assets
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          replacements={
            '<script src="app.js?v=5.5.0"></script>':'<script src="app.js?v=5.5.0-r91807f"></script>',
            '<script src="ui/score-ribbon-playback-follow-v545.js?v=5.5.0"></script>':'<script src="ui/score-ribbon-playback-follow-v545.js?v=5.5.0-r91807f"></script>',
          }
          for old,new in replacements.items():
            count=s.count(old)
            if count!=1:
              raise SystemExit(f'expected exactly one cache target for {old}, found {count}')
            s=s.replace(old,new,1)
          p.write_text(s,encoding='utf-8')
          PY

      - name: Verify cache identity hotfix
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          s=Path('index.html').read_text(encoding='utf-8')
          assert 'app.js?v=5.5.0-r91807f' in s
          assert 'ui/score-ribbon-playback-follow-v545.js?v=5.5.0-r91807f' in s
          assert '<script src="app.js?v=5.5.0"></script>' not in s
          assert '<script src="ui/score-ribbon-playback-follow-v545.js?v=5.5.0"></script>' not in s
          print('cache identity hotfix verified')
          PY

      - name: Commit hotfix and remove one-time workflow
        shell: bash
        run: |
          rm .github/workflows/one-time-cache-identity-hotfix.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html .github/workflows/one-time-cache-identity-hotfix.yml
          git commit -m "Bust frontend cache after playback revert"
          git push origin HEAD:hotfix/frontend-cache-identity-20260913
