name: Temporary Canonical v6.1.11 Verify

on:
  push:
    branches:
      - fix/canonical-console-bootstrap-v6111

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Materialize through production dispatcher
        run: python3 tools/apply_v612_release.py --skip-check
      - name: Verify release/install chain/parallel lanes
        shell: bash
        run: |
          set -euxo pipefail
          test "$(cat VERSION)" = "6.1.11"
          grep -q '_install_canonical_run_integrity_v6110()' sbb/__init__.py
          grep -q '_install_canonical_console_bootstrap_v6111()' sbb/__init__.py
          grep -q '_install_nfl_audit_migration()' sbb/__init__.py
          grep -q 'initial validation snapshot building' canonical-shadow.html
          python3 - <<'PY'
          from pathlib import Path
          text=Path('sbb/__init__.py').read_text()
          a=text.index('_install_canonical_run_integrity_v6110()')
          b=text.index('_install_canonical_console_bootstrap_v6111()')
          assert a < b, (a,b)
          print('PASS: v6.1.11 installs after v6.1.10 and preserves NFL media audit')
          PY
      - name: Focused v6.1.11 regression
        run: python3 tests/test_v6111_canonical_console_bootstrap.py
      - name: Compile v6.1.11 patch
        run: python3 -m py_compile sbb/canonical_console_bootstrap_v6111.py
      - name: Full repository verification
        run: bash VERIFY.sh
