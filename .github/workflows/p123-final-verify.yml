name: Verify Media Audit P1-P3 Final

on:
  push:
    branches:
      - media-audit/p123-final-ownership

permissions:
  contents: read

concurrency:
  group: media-audit-p123-final-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Final P1-P3 branch verification
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout exact branch
        uses: actions/checkout@v7
      - name: Execute P1-P3 regression tests
        run: |
          python3 - <<'PY'
          import runpy
          for path in [
              "tests/test_priority123_media_audit_ownership.py",
              "tests/test_p1_curated_playback_ownership.py",
          ]:
              ns = runpy.run_path(path)
              tests = [(name, fn) for name, fn in ns.items() if name.startswith("test_") and callable(fn)]
              for name, fn in tests:
                  print(f"{path}::{name}")
                  fn()
          PY
      - name: Compile backend ownership modules
        run: python3 -m py_compile sbb/startup.py sbb/route_registry.py sbb/backend_inspector_routes.py sbb/__init__.py
      - name: Parse playback ownership modules
        run: |
          node --check architecture/playback-orchestrator-v5.js
          node --check architecture/playback-early-pause-recovery-v538.js
          node --check ui/browse-curated-programming-v537.js
      - name: Record production preflight drift
        continue-on-error: true
        run: bash VERIFY.sh
      - name: Record legacy v5.5 audit suite drift
        continue-on-error: true
        run: python3 tests/test_v550_media_health_audit.py
