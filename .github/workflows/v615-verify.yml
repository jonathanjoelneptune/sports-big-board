name: Verify v6.1.5 Install Chain

on:
  push:
    branches:
      - fix/v615-canonical-install-chain
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sbb-v615-verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - name: Materialize release
        run: python3 tools/apply_v612_release.py
      - name: Run full verification
        run: bash VERIFY.sh
      - name: Assert installer order
        run: |
          python3 tests/test_v615_canonical_install_chain.py
          python3 - <<'PY'
          from pathlib import Path
          s=Path('sbb/__init__.py').read_text()
          assert s.index('_install_canonical_certification_v611()') < s.index('_install_canonical_validation_v612()')
          print('PASS: v611 engine provider installs before v612 validation consumer')
          PY
