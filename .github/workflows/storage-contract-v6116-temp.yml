name: Verify v6.1.16 Storage Release Compatibility

on:
  push:
    branches:
      - deploy/storage-retention-contract-v6116

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v7
      - name: Apply storage release-contract patch
        run: python3 tools/patch_v6116_storage_contract_temp.py
      - name: Verify source contract
        run: |
          python3 -m py_compile tools/apply_v6116_release.py tests/test_v6116_storage_retention_release.py cloud/vm/backup_state.py
          bash -n cloud/gcp/DEPLOY-FROM-GITHUB.sh
          python3 tests/test_v6116_storage_retention_release.py
      - name: Commit product changes only
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tools/apply_v6116_release.py tests/test_v6116_storage_retention_release.py
          if ! git diff --cached --quiet; then
            git commit -m "Release: preserve bounded storage retention contract"
            git push
          fi
      - name: Materialize and run full release gate
        run: |
          python3 tools/apply_v6116_release.py --skip-check
          python3 tests/test_v6116_storage_retention_release.py
          python3 tests/test_v534_complete_browse_deploy_safety.py
          bash VERIFY.sh
