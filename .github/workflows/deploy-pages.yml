name: Deploy Sports Big Board

on:
  push:
    branches: [main]
    # Sports Ticker refreshes are data-only sidecar updates. They must not
    # restart the cloud backend or canonical Media Audit worker.
    paths-ignore:
      - 'data/sports-ticker.json'
      - 'data/sports-ticker.txt'
      - 'data/sports-ticker-run-log.json'
  workflow_dispatch:
    inputs:
      emergency_bypass:
        description: Bypass the normal production concurrency lock
        required: false
        default: false
        type: boolean
      runner_image:
        description: GitHub-hosted runner pool
        required: true
        default: ubuntu-latest
        type: choice
        options:
          - ubuntu-latest
          - ubuntu-22.04

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  # Normal pushes serialize on one production lane.  A manually dispatched
  # emergency run can opt into a unique lane so a stale GitHub concurrency
  # reservation cannot hold the recovery deploy in QUEUED forever.
  group: ${{ github.event_name == 'workflow_dispatch' && inputs.emergency_bypass && format('sports-big-board-emergency-{0}', github.run_id) || 'sports-big-board-production' }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify release
    runs-on: ${{ github.event_name == 'workflow_dispatch' && inputs.runner_image || 'ubuntu-latest' }}
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
      - name: Run Sports Big Board verification
        run: bash VERIFY.sh

  backend:
    name: Deploy cloud backend
    runs-on: ${{ github.event_name == 'workflow_dispatch' && inputs.runner_image || 'ubuntu-latest' }}
    timeout-minutes: 30
    needs: verify
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Require cloud deployment configuration
        env:
          GCP_PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
          GCP_WORKLOAD_IDENTITY_PROVIDER: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          GCP_DEPLOY_SERVICE_ACCOUNT: ${{ vars.GCP_DEPLOY_SERVICE_ACCOUNT }}
          SBB_API_BASE_URL: ${{ vars.SBB_API_BASE_URL }}
        run: |
          test -n "$GCP_PROJECT_ID" || { echo "Missing repository variable GCP_PROJECT_ID"; exit 1; }
          test -n "$GCP_WORKLOAD_IDENTITY_PROVIDER" || { echo "Missing repository variable GCP_WORKLOAD_IDENTITY_PROVIDER"; exit 1; }
          test -n "$GCP_DEPLOY_SERVICE_ACCOUNT" || { echo "Missing repository variable GCP_DEPLOY_SERVICE_ACCOUNT"; exit 1; }
          test -n "$SBB_API_BASE_URL" || { echo "Missing repository variable SBB_API_BASE_URL"; exit 1; }

      - name: Authenticate to Google Cloud without a stored key
        uses: google-github-actions/auth@v3
        with:
          project_id: ${{ vars.GCP_PROJECT_ID }}
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOY_SERVICE_ACCOUNT }}

      - name: Install Google Cloud CLI
        uses: google-github-actions/setup-gcloud@v3
        with:
          project_id: ${{ vars.GCP_PROJECT_ID }}

      - name: Deploy backend release to Compute Engine
        env:
          SBB_PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
          SBB_ZONE: ${{ vars.SBB_GCP_ZONE || 'us-west2-b' }}
          SBB_VM_NAME: ${{ vars.SBB_GCP_VM_NAME || 'sports-big-board' }}
          GITHUB_SHA: ${{ github.sha }}
        run: bash cloud/gcp/DEPLOY-FROM-GITHUB.sh

      - name: Verify public backend health and release version
        env:
          SBB_API_BASE_URL: ${{ vars.SBB_API_BASE_URL }}
        run: |
          EXPECTED_VERSION="$(tr -d '[:space:]' < VERSION)"
          for attempt in {1..18}; do
            if curl --fail --silent --show-error --max-time 10 "$SBB_API_BASE_URL/api/status" > /tmp/sbb-status.json; then
              ACTUAL_VERSION="$(python3 -c 'import json; print(json.load(open("/tmp/sbb-status.json")).get("version", ""))')"
              cat /tmp/sbb-status.json
              echo
              echo "Expected backend: $EXPECTED_VERSION | Public backend: $ACTUAL_VERSION"
              if [[ "$ACTUAL_VERSION" == "$EXPECTED_VERSION" ]]; then
                exit 0
              fi
            fi
            sleep 5
          done
          echo "Backend health/version check failed. Refusing to publish a frontend against an older backend."
          exit 1

  pages-build:
    name: Build GitHub Pages frontend
    runs-on: ${{ github.event_name == 'workflow_dispatch' && inputs.runner_image || 'ubuntu-latest' }}
    timeout-minutes: 30
    needs: backend
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
      - name: Build static frontend
        env:
          SBB_API_BASE_URL: ${{ vars.SBB_API_BASE_URL }}
          GCP_PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
          SBB_SOUNDTRACK_BASE_URL: ${{ vars.SBB_SOUNDTRACK_BASE_URL }}
        run: python3 cloud/github-pages/build_pages.py "$SBB_API_BASE_URL" .pages-dist
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: .pages-dist

  pages-deploy:
    name: Publish GitHub Pages
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ${{ github.event_name == 'workflow_dispatch' && inputs.runner_image || 'ubuntu-latest' }}
    timeout-minutes: 30
    needs: pages-build
    outputs:
      page_url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy frontend
        id: deployment
        uses: actions/deploy-pages@v4

  production-smoke:
    name: Verify deployed frontend/backend handshake
    runs-on: ${{ github.event_name == 'workflow_dispatch' && inputs.runner_image || 'ubuntu-latest' }}
    timeout-minutes: 30
    needs: pages-deploy
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
      - name: Verify public milestone release
        env:
          PAGE_URL: ${{ needs.pages-deploy.outputs.page_url }}
          SBB_API_BASE_URL: ${{ vars.SBB_API_BASE_URL }}
        run: |
          EXPECTED_VERSION="$(tr -d '[:space:]' < VERSION)"
          PAGE_URL="${PAGE_URL%/}/"
          echo "Checking frontend $PAGE_URL against backend $SBB_API_BASE_URL for $EXPECTED_VERSION"
          for attempt in {1..24}; do
            if curl --fail --silent --show-error --max-time 10 -H 'Cache-Control: no-cache' "${PAGE_URL}?release=${GITHUB_SHA}" > /tmp/sbb-index.html; then
              if grep -q "app.js?v=${EXPECTED_VERSION}" /tmp/sbb-index.html && grep -q "architecture/milestone-console.js?v=${EXPECTED_VERSION}" /tmp/sbb-index.html; then
                break
              fi
            fi
            if [[ "$attempt" == "24" ]]; then echo "GitHub Pages is not serving the expected frontend generation"; cat /tmp/sbb-index.html 2>/dev/null || true; exit 1; fi
            sleep 5
          done
          fetch_backend_json() {
            local label="$1"
            local url="$2"
            local output="$3"
            local attempts="${4:-10}"
            for attempt in $(seq 1 "$attempts"); do
              echo "[$label] attempt $attempt/$attempts"
              if curl --fail --silent --show-error \
                --connect-timeout 5 --max-time 20 \
                -H 'Cache-Control: no-cache' \
                "$url" > "$output"; then
                if [[ -s "$output" ]]; then
                  echo "[$label] response received ($(wc -c < "$output") bytes)"
                  return 0
                fi
                echo "[$label] empty response"
              else
                rc=$?
                echo "[$label] curl failed with exit code $rc"
              fi
              if [[ "$attempt" != "$attempts" ]]; then sleep 5; fi
            done
            echo "[$label] failed after $attempts attempts"
            return 1
          }

          fetch_backend_json \
            "backend-status" \
            "$SBB_API_BASE_URL/api/status" \
            /tmp/sbb-status.json \
            10

          fetch_backend_json \
            "milestone-console" \
            "$SBB_API_BASE_URL/api/milestone/console?frontendVersion=$EXPECTED_VERSION&limit=40" \
            /tmp/sbb-milestone.json \
            10

          python3 - <<'PY'
          import json
          expected=open('VERSION').read().strip()
          status=json.load(open('/tmp/sbb-status.json'))
          milestone=json.load(open('/tmp/sbb-milestone.json'))
          assert status.get('version')==expected,(status.get('version'),expected)
          assert milestone.get('version')==expected,(milestone.get('version'),expected)
          assert milestone.get('versionMatch') is True,milestone.get('extra',{}).get('release')
          print(f'PASS deployed frontend/backend milestone handshake: {expected}')
          PY
