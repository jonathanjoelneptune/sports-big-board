name: Deploy Sports Big Board

on:
  push:
    branches: [main]
    # Sports Ticker refreshes and ticker-sidecar implementation/test changes do
    # not alter the Pages bundle or VM runtime. They are verified by the ticker
    # sidecar workflow and must not restart/redeploy the Big Board.
    paths-ignore:
      - 'data/sports-ticker.json'
      - 'data/sports-ticker.txt'
      - 'data/sports-ticker-run-log.json'
      - 'tools/refresh_sports_ticker*.py'
      - 'tests/test_a4*.py'
      - 'tests/test_sports_ticker_current.py'
      - '.github/workflows/sports-ticker-refresh.yml'
      - '.github/workflows/sports-ticker-scheduler-v2.yml'
  workflow_dispatch:
    inputs:
      emergency_bypass:
        description: Bypass the normal production concurrency lock
        required: false
        default: false
        type: boolean
      runner_image:
        description: GitHub-hosted runner pool
        required: true
        default: ubuntu-latest
        type: choice
        options:
          - ubuntu-latest
          - ubuntu-22.04

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: ${{ github.event_name == 'workflow_dispatch' && inputs.emergency_bypass && format('sports-big-board-emergency-{0}', github.run_id) || 'sports-big-board-production' }}
  # Never cancel a release that may already be changing the VM/catalog. New
  # production pushes queue behind the active deployment instead.
  cancel-in-progress: false

jobs:
  classify:
    name: Classify deployment scope and prepare frontend
    runs-on: ${{ github.event_name == 'workflow_dispatch' && inputs.runner_image || 'ubuntu-latest' }}
    timeout-minutes: 30
    outputs:
      backend_required: ${{ steps.scope.outputs.backend_required }}
      frontend_only: ${{ steps.scope.outputs.frontend_only }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 1
      - name: Fetch prior commit for classification
        if: ${{ github.event_name == 'push' && github.event.before != '0000000000000000000000000000000000000000' }}
        env:
          BEFORE_SHA: ${{ github.event.before }}
        run: |
          if ! git cat-file -e "${BEFORE_SHA}^{commit}" 2>/dev/null; then
            git fetch --no-tags --depth=1 origin "$BEFORE_SHA"
          fi
      - name: Classify changed files
        id: scope
        env:
          BEFORE_SHA: ${{ github.event.before }}
          AFTER_SHA: ${{ github.sha }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          EXTRA=()
          if [[ "$EVENT_NAME" == "workflow_dispatch" ]]; then EXTRA+=(--force-backend); fi
          python3 tools/classify_deploy_scope.py \
            --before "$BEFORE_SHA" \
            --after "$AFTER_SHA" \
            --github-output "$GITHUB_OUTPUT" \
            "${EXTRA[@]}"
      - name: Materialize frontend release checkout
        if: ${{ steps.scope.outputs.frontend_only == 'true' }}
        run: python3 tools/apply_v612_release.py
      - name: Run focused frontend verification
        if: ${{ steps.scope.outputs.frontend_only == 'true' }}
        run: python3 tools/verify_frontend.py
      - name: Verify focused frontend lane contract
        if: ${{ steps.scope.outputs.frontend_only == 'true' }}
        run: python3 tests/test_frontend_verify_lane.py
      - name: Verify deploy-scope classifier
        if: ${{ steps.scope.outputs.frontend_only == 'true' }}
        run: python3 tests/test_deploy_scope_classifier.py
      - name: Verify existing backend for frontend-only deploy
        if: ${{ steps.scope.outputs.frontend_only == 'true' }}
        env:
          SBB_API_BASE_URL: ${{ vars.SBB_API_BASE_URL }}
        run: |
          EXPECTED_VERSION="$(tr -d '[:space:]' < VERSION)"
          curl --fail --silent --show-error --max-time 15 "$SBB_API_BASE_URL/api/status" > /tmp/sbb-existing-status.json
          ACTUAL_VERSION="$(python3 -c 'import json; print(json.load(open("/tmp/sbb-existing-status.json")).get("version", ""))')"
          cat /tmp/sbb-existing-status.json
          echo
          echo "FRONTEND FAST PATH: backend deploy skipped. Expected existing backend $EXPECTED_VERSION; found $ACTUAL_VERSION."
          test "$ACTUAL_VERSION" = "$EXPECTED_VERSION"
      - name: Build static frontend for fast path
        if: ${{ steps.scope.outputs.frontend_only == 'true' }}
        env:
          SBB_API_BASE_URL: ${{ vars.SBB_API_BASE_URL }}
          GCP_PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
          SBB_SOUNDTRACK_BASE_URL: ${{ vars.SBB_SOUNDTRACK_BASE_URL }}
        run: python3 cloud/github-pages/build_pages.py "$SBB_API_BASE_URL" .pages-dist
      - name: Configure GitHub Pages for fast path
        if: ${{ steps.scope.outputs.frontend_only == 'true' }}
        uses: actions/configure-pages@v5
      - name: Upload Pages artifact for fast path
        if: ${{ steps.scope.outputs.frontend_only == 'true' }}
        uses: actions/upload-pages-artifact@v4
        with:
          path: .pages-dist

  verify:
    name: Verify full release
    runs-on: ${{ github.event_name == 'workflow_dispatch' && inputs.runner_image || 'ubuntu-latest' }}
    timeout-minutes: 30
    needs: classify
    if: ${{ needs.classify.outputs.backend_required == 'true' }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
      - name: Materialize release checkout
        run: python3 tools/apply_v612_release.py
      - name: Run full Sports Big Board verification
        run: bash VERIFY.sh
      - name: Verify focused frontend lane contract
        run: python3 tests/test_frontend_verify_lane.py
      - name: Verify deploy-scope classifier
        run: python3 tests/test_deploy_scope_classifier.py

  backend:
    name: Deploy cloud backend
    runs-on: ${{ github.event_name == 'workflow_dispatch' && inputs.runner_image || 'ubuntu-latest' }}
    timeout-minutes: 30
    needs: [classify, verify]
    if: ${{ needs.classify.outputs.backend_required == 'true' }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
      - name: Materialize release checkout
        run: python3 tools/apply_v612_release.py

      - name: Require cloud deployment configuration
        env:
          GCP_PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
          GCP_WORKLOAD_IDENTITY_PROVIDER: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          GCP_DEPLOY_SERVICE_ACCOUNT: ${{ vars.GCP_DEPLOY_SERVICE_ACCOUNT }}
          SBB_API_BASE_URL: ${{ vars.SBB_API_BASE_URL }}
        run: |
          test -n "$GCP_PROJECT_ID" || { echo "Missing repository variable GCP_PROJECT_ID"; exit 1; }
          test -n "$GCP_WORKLOAD_IDENTITY_PROVIDER" || { echo "Missing repository variable GCP_WORKLOAD_IDENTITY_PROVIDER"; exit 1; }
          test -n "$GCP_DEPLOY_SERVICE_ACCOUNT" || { echo "Missing repository variable GCP_DEPLOY_SERVICE_ACCOUNT"; exit 1; }
          test -n "$SBB_API_BASE_URL" || { echo "Missing repository variable SBB_API_BASE_URL"; exit 1; }

      - name: Authenticate to Google Cloud without a stored key
        uses: google-github-actions/auth@v3
        with:
          project_id: ${{ vars.GCP_PROJECT_ID }}
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOY_SERVICE_ACCOUNT }}

      - name: Install Google Cloud CLI
        uses: google-github-actions/setup-gcloud@v3
        with:
          project_id: ${{ vars.GCP_PROJECT_ID }}

      - name: Deploy backend release to Compute Engine
        env:
          SBB_PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
          SBB_ZONE: ${{ vars.SBB_GCP_ZONE || 'us-west2-b' }}
          SBB_VM_NAME: ${{ vars.SBB_GCP_VM_NAME || 'sports-big-board' }}
          GITHUB_SHA: ${{ github.sha }}
        run: bash cloud/gcp/DEPLOY-FROM-GITHUB.sh

      - name: Verify public backend health and release version
        env:
          SBB_API_BASE_URL: ${{ vars.SBB_API_BASE_URL }}
        run: |
          EXPECTED_VERSION="$(tr -d '[:space:]' < VERSION)"
          for attempt in {1..18}; do
            if curl --fail --silent --show-error --max-time 10 "$SBB_API_BASE_URL/api/status" > /tmp/sbb-status.json; then
              ACTUAL_VERSION="$(python3 -c 'import json; print(json.load(open("/tmp/sbb-status.json")).get("version", ""))')"
              cat /tmp/sbb-status.json
              echo
              echo "Expected backend: $EXPECTED_VERSION | Public backend: $ACTUAL_VERSION"
              if [[ "$ACTUAL_VERSION" == "$EXPECTED_VERSION" ]]; then
                exit 0
              fi
            fi
            sleep 5
          done
          echo "Backend health/version check failed. Refusing to publish a frontend against an older backend."
          exit 1

  pages-build:
    name: Build GitHub Pages frontend after backend deploy
    runs-on: ${{ github.event_name == 'workflow_dispatch' && inputs.runner_image || 'ubuntu-latest' }}
    timeout-minutes: 30
    needs: [classify, verify, backend]
    if: ${{ always() && needs.classify.outputs.backend_required == 'true' && needs.verify.result == 'success' && needs.backend.result == 'success' }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
      - name: Materialize release checkout
        run: python3 tools/apply_v612_release.py
      - name: Build static frontend
        env:
          SBB_API_BASE_URL: ${{ vars.SBB_API_BASE_URL }}
          GCP_PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
          SBB_SOUNDTRACK_BASE_URL: ${{ vars.SBB_SOUNDTRACK_BASE_URL }}
        run: python3 cloud/github-pages/build_pages.py "$SBB_API_BASE_URL" .pages-dist
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: .pages-dist

  pages-deploy:
    name: Publish GitHub Pages
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ${{ github.event_name == 'workflow_dispatch' && inputs.runner_image || 'ubuntu-latest' }}
    timeout-minutes: 30
    needs: [classify, pages-build]
    if: ${{ always() && ((needs.classify.outputs.frontend_only == 'true' && needs.classify.result == 'success') || (needs.classify.outputs.backend_required == 'true' && needs.pages-build.result == 'success')) }}
    outputs:
      page_url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy frontend
        id: deployment
        uses: actions/deploy-pages@v4

  production-smoke:
    name: Verify deployed frontend/backend handshake
    runs-on: ${{ github.event_name == 'workflow_dispatch' && inputs.runner_image || 'ubuntu-latest' }}
    timeout-minutes: 30
    needs: pages-deploy
    if: ${{ always() && needs.pages-deploy.result == 'success' }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
      - name: Materialize release checkout
        run: python3 tools/apply_v612_release.py
      - name: Verify public milestone release
        env:
          PAGE_URL: ${{ needs.pages-deploy.outputs.page_url }}
          SBB_API_BASE_URL: ${{ vars.SBB_API_BASE_URL }}
        run: |
          EXPECTED_VERSION="$(tr -d '[:space:]' < VERSION)"
          PAGE_URL="${PAGE_URL%/}/"
          echo "Checking frontend $PAGE_URL against backend $SBB_API_BASE_URL for $EXPECTED_VERSION"
          for attempt in {1..24}; do
            if curl --fail --silent --show-error --max-time 10 -H 'Cache-Control: no-cache' "${PAGE_URL}?release=${GITHUB_SHA}" > /tmp/sbb-index.html; then
              if grep -q "app.js?v=${EXPECTED_VERSION}" /tmp/sbb-index.html && grep -q "architecture/milestone-console.js?v=${EXPECTED_VERSION}" /tmp/sbb-index.html; then
                break
              fi
            fi
            sleep 5
          done
          grep -q "app.js?v=${EXPECTED_VERSION}" /tmp/sbb-index.html
          grep -q "architecture/milestone-console.js?v=${EXPECTED_VERSION}" /tmp/sbb-index.html
          curl --fail --silent --show-error --max-time 15 "$SBB_API_BASE_URL/api/status" > /tmp/sbb-public-status.json
          ACTUAL_VERSION="$(python3 -c 'import json; print(json.load(open("/tmp/sbb-public-status.json")).get("version", ""))')"
          cat /tmp/sbb-public-status.json
          echo
          echo "Production handshake: frontend $EXPECTED_VERSION | backend $ACTUAL_VERSION"
          test "$ACTUAL_VERSION" = "$EXPECTED_VERSION"
