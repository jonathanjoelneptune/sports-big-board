name: Deploy Sports Big Board

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: sports-big-board-production
  cancel-in-progress: false

jobs:
  verify:
    name: Verify release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Run Sports Big Board verification
        run: bash VERIFY.sh


  backend:
    name: Deploy cloud backend
    runs-on: ubuntu-latest
    needs: verify

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Require cloud deployment configuration
        env:
          GCP_PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
          GCP_WORKLOAD_IDENTITY_PROVIDER: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          GCP_DEPLOY_SERVICE_ACCOUNT: ${{ vars.GCP_DEPLOY_SERVICE_ACCOUNT }}
          SBB_API_BASE_URL: ${{ vars.SBB_API_BASE_URL }}
        run: |
          test -n "$GCP_PROJECT_ID" || {
            echo "Missing repository variable GCP_PROJECT_ID"
            exit 1
          }

          test -n "$GCP_WORKLOAD_IDENTITY_PROVIDER" || {
            echo "Missing repository variable GCP_WORKLOAD_IDENTITY_PROVIDER"
            exit 1
          }

          test -n "$GCP_DEPLOY_SERVICE_ACCOUNT" || {
            echo "Missing repository variable GCP_DEPLOY_SERVICE_ACCOUNT"
            exit 1
          }

          test -n "$SBB_API_BASE_URL" || {
            echo "Missing repository variable SBB_API_BASE_URL"
            exit 1
          }

      - name: Authenticate to Google Cloud without a stored key
        uses: google-github-actions/auth@v2
        with:
          project_id: ${{ vars.GCP_PROJECT_ID }}
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOY_SERVICE_ACCOUNT }}

      - name: Install Google Cloud CLI
        uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: ${{ vars.GCP_PROJECT_ID }}

      - name: Deploy backend release to Compute Engine
        env:
          SBB_PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
          SBB_ZONE: ${{ vars.SBB_GCP_ZONE || 'us-west2-b' }}
          SBB_VM_NAME: ${{ vars.SBB_GCP_VM_NAME || 'sports-big-board' }}
          GITHUB_SHA: ${{ github.sha }}
        run: |
          bash cloud/gcp/DEPLOY-FROM-GITHUB.sh

      - name: Verify public backend health
        env:
          SBB_API_BASE_URL: ${{ vars.SBB_API_BASE_URL }}
        run: |
          echo "Checking Sports Big Board backend:"
          echo "$SBB_API_BASE_URL/api/status"

          for attempt in {1..18}; do
            echo "Health check attempt $attempt of 18..."

            if curl \
              --fail \
              --silent \
              --show-error \
              --max-time 10 \
              "$SBB_API_BASE_URL/api/status" \
              > /tmp/sbb-status.json
            then
              echo "Backend is healthy:"
              cat /tmp/sbb-status.json
              echo
              exit 0
            fi

            sleep 5
          done

          echo "Backend public health check failed:"
          echo "$SBB_API_BASE_URL/api/status"
          exit 1


  pages-build:
    name: Build GitHub Pages frontend
    runs-on: ubuntu-latest
    needs: backend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Build static frontend
        env:
          SBB_API_BASE_URL: ${{ vars.SBB_API_BASE_URL }}
        run: |
          python3 cloud/github-pages/build_pages.py \
            "$SBB_API_BASE_URL" \
            .pages-dist

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: .pages-dist


  pages-deploy:
    name: Publish GitHub Pages
    runs-on: ubuntu-latest
    needs: pages-build

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy frontend
        id: deployment
        uses: actions/deploy-pages@v4
