name: Deploy Sports Big Board Frontend

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Require cloud API URL
        env:
          SBB_API_BASE_URL: ${{ vars.SBB_API_BASE_URL }}
        run: |
          test -n "$SBB_API_BASE_URL" || { echo "Set repository variable SBB_API_BASE_URL first."; exit 1; }

      - name: Build static frontend
        env:
          SBB_API_BASE_URL: ${{ vars.SBB_API_BASE_URL }}
        run: python3 cloud/github-pages/build_pages.py "$SBB_API_BASE_URL" .pages-dist

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: .pages-dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
