name: Verify v6.1.4 Release

on:
  push:
    branches:
      - deploy/v614-fast-safe-deploy
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sbb-v614-verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Rehearse v6.1.4 materialization
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout branch
        uses: actions/checkout@v7
      - name: Materialize release through production entry point
        run: python3 tools/apply_v612_release.py
      - name: Run full verification
        run: bash VERIFY.sh
      - name: Assert v6.1.4 smoke contracts
        run: |
          test "$(tr -d '[:space:]' < VERSION)" = "6.1.4"
          grep -F 'while True:' sbb/canonical_validation_v612.py
          ! grep -F 'deadline=_now()+120' sbb/canonical_validation_v612.py
          grep -F 'independent asset cache generation' cloud/github-pages/build_pages.py
          grep -F 'SBB_MEDIA_REPAIR_ENABLED", "0"' media_audit_service.py
          echo 'PASS: v6.1.4 release rehearsal complete'
