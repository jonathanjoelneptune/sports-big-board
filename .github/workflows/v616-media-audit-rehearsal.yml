name: Rehearse v6.1.6 Continuous Media Audit

on:
  push:
    branches:
      - media-audit/continuous-v616

permissions:
  contents: read

concurrency:
  group: sbb-v616-media-audit-rehearsal
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - name: Materialize v6.1.6 release
        run: python3 tools/apply_v612_release.py
      - name: Full Sports Big Board verification
        run: bash VERIFY.sh
      - name: Explicit continuous audit contract
        run: python3 tests/test_v616_continuous_media_audit.py
