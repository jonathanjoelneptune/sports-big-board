name: Rehearse v6.1.15 Team Resolution

on:
  push:
    branches:
      - media-audit/team-resolution-control-loop-v6115

permissions:
  contents: read

concurrency:
  group: rehearse-v6115-team-resolution
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Materialize v6.1.15
        run: python3 tools/apply_v6115_release.py --skip-check
      - name: Full release verification
        run: bash VERIFY.sh
      - name: Team resolution control-loop contracts
        run: |
          python3 tests/test_v6115_team_resolution_queue.py
          python3 tests/test_v6115_team_resolution_release.py
