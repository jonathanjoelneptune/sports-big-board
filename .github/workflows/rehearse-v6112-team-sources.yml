name: Rehearse v6.1.12 Team Sources

on:
  push:
    branches:
      - media-audit/team-source-registry-v6112

permissions:
  contents: read

concurrency:
  group: rehearse-v6112-team-sources
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Materialize v6.1.12
        run: python3 tools/apply_v612_release.py --skip-check
      - name: Full release verification
        run: bash VERIFY.sh
      - name: Team source contract
        run: |
          python3 tests/test_v6112_team_source_registry.py
          python3 tests/test_v6112_team_source_release.py
