name: Verify Sports Big Board Release Candidate

on:
  push:
    branches:
      - release-candidate
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sports-big-board-release-candidate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Full deploy rehearsal
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout candidate repository
        uses: actions/checkout@v7
      - name: Run exact production release verification
        run: bash VERIFY.sh
      - name: Dry-build GitHub Pages artifact
        env:
          GCP_PROJECT_ID: sportsbigboard
        run: |
          rm -rf /tmp/sbb-pages-rehearsal
          python3 cloud/github-pages/build_pages.py https://203-0-113-10.sslip.io /tmp/sbb-pages-rehearsal
          test -f /tmp/sbb-pages-rehearsal/index.html
          test -f /tmp/sbb-pages-rehearsal/config.js
          EXPECTED_VERSION="$(tr -d '[:space:]' < VERSION)"
          grep -q "app.js?v=${EXPECTED_VERSION}" /tmp/sbb-pages-rehearsal/index.html
          grep -q "architecture/milestone-console.js?v=${EXPECTED_VERSION}" /tmp/sbb-pages-rehearsal/index.html
      - name: Candidate verified
        run: echo "PASS - this exact branch is ready to promote to main"
