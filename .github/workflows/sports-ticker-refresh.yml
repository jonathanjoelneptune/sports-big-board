name: Sports Ticker Sidecar Refresh (Manual)

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sports-ticker-sidecar-refresh
  cancel-in-progress: false

jobs:
  refresh:
    name: Refresh cached Sports Ticker data
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Source configuration summary
        shell: bash
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          HIGHLIGHTLY_API_KEY: ${{ secrets.HIGHLIGHTLY_API_KEY }}
        run: |
          set -euo pipefail
          if [[ -z "${OPENAI_API_KEY:-}" ]]; then
            echo "::warning title=OPENAI_API_KEY missing::A3 can collect sources, but cannot rebuild the ticker when candidates change."
          else
            echo "OPENAI_API_KEY configured."
          fi

          if [[ -z "${HIGHLIGHTLY_API_KEY:-}" ]]; then
            echo "::warning title=HIGHLIGHTLY_API_KEY missing::A3 will run with ESPN + official league sources only."
          else
            echo "HIGHLIGHTLY_API_KEY configured."
          fi

      - name: Refresh Sports Ticker A3
        id: ticker
        shell: bash
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          HIGHLIGHTLY_API_KEY: ${{ secrets.HIGHLIGHTLY_API_KEY }}
          SPORTS_TICKER_EDITOR_MODEL: ${{ vars.SPORTS_TICKER_EDITOR_MODEL || 'gpt-4o-mini' }}
        run: |
          set +e
          python3 tools/refresh_sports_ticker.py
          code=$?
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Commit ticker and last-run diagnostics
        shell: bash
        run: |
          set -euo pipefail

          ALLOWED=(
            "data/sports-ticker.json"
            "data/sports-ticker.txt"
            "data/sports-ticker-run-log.json"
          )

          if git diff --quiet -- "${ALLOWED[@]}"; then
            echo "No Sports Ticker files changed. Nothing to commit."
            exit 0
          fi

          git config user.name "sports-ticker-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add -- "${ALLOWED[@]}"

          CHANGED="$(git diff --cached --name-only)"
          echo "$CHANGED"

          while IFS= read -r path; do
            [[ -z "$path" ]] && continue
            case "$path" in
              data/sports-ticker.json|data/sports-ticker.txt|data/sports-ticker-run-log.json) ;;
              *)
                echo "::error title=Sports Ticker safety boundary::Unexpected staged path: $path"
                exit 1
                ;;
            esac
          done <<< "$CHANGED"

          git commit -m "Sports Ticker: A3 refresh $(date -u '+%Y-%m-%d %H:%M UTC')"

          for attempt in 1 2 3; do
            git fetch origin main
            git rebase origin/main

            if git push origin HEAD:main; then
              echo "Sports Ticker A3 files pushed successfully."
              exit 0
            fi

            echo "Push race on attempt $attempt; retrying."
            sleep $((attempt * 3))
          done

          echo "::error title=Sports Ticker push failed::Could not fast-forward main after three attempts."
          exit 1

      - name: Fail workflow if A3 pipeline failed
        if: steps.ticker.outputs.exit_code != '0'
        shell: bash
        run: |
          echo "::error title=Sports Ticker A3 failed::See data/sports-ticker-run-log.json for the complete source/pipeline/OpenAI diagnostic record."
          exit 1
