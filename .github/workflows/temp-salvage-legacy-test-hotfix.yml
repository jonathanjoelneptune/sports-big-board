name: Temporary salvage legacy-test hotfix

on:
  push:
    branches:
      - media-repair/salvage-legacy-test-hotfix

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Update legacy Media Audit contract for R21 salvage
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path=Path('tests/test_v550_media_health_audit.py')
          text=path.read_text(encoding='utf-8')
          start_marker='# R19/R20: known media must remain eligible for bounded repair recertification instead of\n'
          end_marker='assert "sourceEligibleKnown" in js\n'
          start=text.index(start_marker)
          end=text.index(end_marker,start)+len(end_marker)
          replacement='''# R21: known media salvage/revalidation must run before fresh discovery.\n# The legacy R19/R20 recertification phase names were intentionally retired.\nfor token in [\n    'REPAIR_SALVAGE_CANDIDATE_LIMIT','REPAIR_SALVAGE_STALE_SECONDS',\n    'def refresh_repair_known_transport','def _repair_plan_snapshot',\n    'def _merge_salvage_transport','def _salvage_known_candidates',\n    'KNOWN_TRANSPORT_REFRESH','KNOWN_CANDIDATE_SALVAGE','SALVAGE_KNOWN_CANDIDATE',\n    'sourceEligibleKnown','knownCandidatesEligible','knownTransportRefreshes',\n    'salvageTransportPersisted','transportChanged',\n]:\n    assert token in service or token in js,token\nrepair_discovery=service[service.index('def _repair_by_discovery'):service.index('@staticmethod',service.index('def _repair_by_discovery'))]\nassert repair_discovery.index('_salvage_known_candidates(job,before,target,tested)') < repair_discovery.index('_deep_catalog_candidates')\nassert "if promoted and promoted.get('health')=='HEALTHY': return promoted" in repair_discovery\nassert "if (runtime=='FAILED' or assoc=='QUARANTINED') and _hard_media_failure_reason(failure):" in service\nassert 'refresh_repair_known_transport' in service\nassert 'sourceEligibleKnown' in js\n'''
          path.write_text(text[:start]+replacement+text[end:],encoding='utf-8')
          PY
      - name: Remove temporary workflow and commit hotfix
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git rm .github/workflows/temp-salvage-legacy-test-hotfix.yml
          git add tests/test_v550_media_health_audit.py
          git commit -m "Tests: update legacy Media Audit contract for R21 salvage"
          git push
