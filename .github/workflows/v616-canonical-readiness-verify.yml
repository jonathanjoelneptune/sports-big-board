name: Verify v6.1.6 Canonical Readiness

on:
  push:
    branches:
      - fix/canonical-slate-readiness-v616
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sbb-v616-canonical-readiness-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - name: Materialize current release
        run: python3 tools/apply_v612_release.py
      - name: Verify canonical readiness regression
        run: python3 tests/test_v616_canonical_slate_readiness.py
      - name: Verify install order
        run: |
          python3 - <<'PY'
          from pathlib import Path
          text=Path('sbb/__init__.py').read_text()
          assert '_install_canonical_certification_v611()' in text
          assert '_install_canonical_validation_v612()' in text
          assert '_install_canonical_slate_readiness_v616()' in text
          assert text.index('_install_canonical_certification_v611()') < text.index('_install_canonical_validation_v612()') < text.index('_install_canonical_slate_readiness_v616()')
          print('PASS: canonical install order is hardening -> validation -> readiness')
          PY
      - name: Run full verification
        run: bash VERIFY.sh
