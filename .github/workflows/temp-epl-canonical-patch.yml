name: Temporary EPL Canonical Patch Runner

on:
  push:
    branches: [main]

jobs:
  patch-feature-branch:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout isolated feature branch
        uses: actions/checkout@v7
        with:
          ref: fix/epl-canonical-scoreboard-window
          fetch-depth: 0
      - name: Load patch helper from main
        run: |
          git fetch origin main
          git show origin/main:tools/temp_apply_epl_canonical_fix.py > /tmp/temp_apply_epl_canonical_fix.py
      - name: Apply patch
        run: python /tmp/temp_apply_epl_canonical_fix.py
      - name: Compile backend
        run: python -m py_compile server.py
      - name: Run focused EPL/NFL regression
        run: python -m unittest -v tests.test_epl_scoreboard_exact_dates
      - name: Commit verified feature patch
        run: |
          git config user.name "canonical-slate-fix-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add server.py tests/test_epl_scoreboard_exact_dates.py
          git commit -m "Fix EPL canonical scoreboard exact-date fallback"
          git push origin HEAD:fix/epl-canonical-scoreboard-window
