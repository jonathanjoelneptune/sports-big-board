name: Temporary EPL Canonical Patch Runner

on:
  push:
    branches: [main]

jobs:
  verify-feature-branch:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout isolated feature branch
        uses: actions/checkout@v7
        with:
          ref: fix/epl-canonical-scoreboard-window
          fetch-depth: 0
      - name: Materialize current release
        run: python3 tools/apply_v6114_release.py --skip-check
      - name: Compile patched backend
        run: python3 -m py_compile server.py
      - name: Run EPL/NFL transport regression
        run: python3 -m unittest -v tests.test_epl_scoreboard_exact_dates
