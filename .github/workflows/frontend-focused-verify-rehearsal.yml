name: Rehearse Frontend Focused Verification

on:
  push:
    branches:
      - ci/frontend-focused-verification
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sbb-frontend-focused-verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rehearse:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - name: Materialize release checkout
        run: python3 tools/apply_v612_release.py
      - name: Prove full verifier remains green
        run: bash VERIFY.sh
      - name: Prove focused frontend verifier
        run: python3 tools/verify_frontend.py
      - name: Verify focused lane contract
        run: python3 tests/test_frontend_verify_lane.py
      - name: Verify deploy classifier
        run: python3 tests/test_deploy_scope_classifier.py
