name: NFL Source Cutover Test

on:
  push:
    branches:
      - release-candidate

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - name: Compile changed Python modules
        run: python3 -m py_compile sbb/nfl_club_sources.py sbb/provider_registry.py sbb/__init__.py
      - name: Install pytest
        run: python3 -m pip install -q pytest
      - name: Run focused NFL source tests
        run: python3 -m pytest -q tests/test_nfl_club_sources.py
